<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin – 312goal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4f0ec;
    --text: #1a1a1a;
    --accent: #e04a2f;
    --muted: #9a9590;
    --bar-bg: #ddd8d2;
    --card: #fff;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Overlay / Modal ─── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,20,20,0.7);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .overlay.hidden { display: none; }

  .modal {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 28px 28px;
    width: 320px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal .lock-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }
  .modal h2 {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 20px;
    margin-bottom: 6px;
  }
  .modal p {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .pin-input {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .pin-input input {
    width: 52px; height: 56px;
    border: 2px solid var(--bar-bg);
    border-radius: 12px;
    text-align: center;
    font-size: 24px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    -webkit-text-security: disc;
  }
  .pin-input input:focus { border-color: var(--accent); }
  .pin-input input.error {
    border-color: #e04a2f;
    animation: shake 0.3s;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .modal .err-msg {
    font-size: 12px;
    color: var(--accent);
    min-height: 16px;
    margin-bottom: 8px;
  }

  /* ─── Buttons ─── */
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ─── Main content ─── */
  .header {
    padding: 28px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .header h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 20px;
  }
  .header .badge {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    margin: 12px 16px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .card-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .member-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin-bottom: 14px;
  }

  .field-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .field-group {
    flex: 1;
  }
  .field-group label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 400;
  }
  .field-group input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--bar-bg);
    border-radius: 10px;
    font-size: 20px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    background: var(--bg);
    color: var(--text);
    outline: none;
    text-align: center;
    transition: border-color 0.2s;
  }
  .field-group input[type="number"]:focus { border-color: var(--accent); }

  .slash {
    font-size: 24px;
    color: var(--muted);
    padding-top: 18px;
    font-family: 'Outfit', sans-serif;
  }

  /* ─── Image upload ─── */
  .img-upload-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .img-upload-group {
    flex: 1;
  }
  .img-upload-group > span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .upload-btn {
    display: block;
    width: 100%;
    padding: 10px 6px;
    background: var(--bg);
    border: 2px dashed var(--bar-bg);
    border-radius: 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    text-align: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent); }
  .img-upload-group input[type="file"] { display: none; }

  /* ─── Save section ─── */
  .save-area {
    margin: 8px 16px 0;
  }
  .save-area .btn {
    font-size: 16px;
    padding: 16px;
  }

  .status-msg {
    font-size: 13px;
    text-align: center;
    min-height: 20px;
    margin-top: 12px;
    color: var(--muted);
  }
  .status-msg.ok { color: #2a9d5c; }
  .status-msg.err { color: var(--accent); }
</style>
</head>
<body>

<!-- ─── Password Modal ─── -->
<div class="overlay" id="pwOverlay">
  <div class="modal">
    <div class="lock-icon">🔒</div>
    <h2>관리자 로그인</h2>
    <p>4자리 PIN을 입력하세요</p>
    <div class="pin-input" id="pinInputs">
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>
    <div class="err-msg" id="pwErr"></div>
  </div>
</div>

<!-- ─── Main ─── -->
<div id="mainContent" style="display:none">
  <div class="header">
    <h1>⚙️ 진척도 관리</h1>
    <span class="badge">admin</span>
  </div>

  <!-- 천 -->
  <div class="card">
    <div class="card-label">member 01</div>
    <div class="member-name">천</div>
    <div class="field-row">
      <div class="field-group">
        <label>현재 횟수</label>
        <input type="number" id="chun-current" min="0">
      </div>
      <div class="slash">/</div>
      <div class="field-group">
        <label>목표 횟수</label>
        <input type="number" id="chun-total" min="1">
      </div>
    </div>
    <div class="img-upload-row">
      <div class="img-upload-group">
        <span>Before 사진</span>
        <label class="upload-btn" for="img-chun-before">📷 파일 선택</label>
        <input type="file" id="img-chun-before" accept="image/*" onchange="uploadImg(this, 1, 'before')">
      </div>
      <div class="img-upload-group">
        <span>Goal 사진</span>
        <label class="upload-btn" for="img-chun-goal">📷 파일 선택</label>
        <input type="file" id="img-chun-goal" accept="image/*" onchange="uploadImg(this, 1, 'goal')">
      </div>
    </div>
  </div>

  <!-- 호 -->
  <div class="card">
    <div class="card-label">member 02</div>
    <div class="member-name">호</div>
    <div class="field-row">
      <div class="field-group">
        <label>현재 횟수</label>
        <input type="number" id="ho-current" min="0">
      </div>
      <div class="slash">/</div>
      <div class="field-group">
        <label>목표 횟수</label>
        <input type="number" id="ho-total" min="1">
      </div>
    </div>
    <div class="img-upload-row">
      <div class="img-upload-group">
        <span>Before 사진</span>
        <label class="upload-btn" for="img-ho-before">📷 파일 선택</label>
        <input type="file" id="img-ho-before" accept="image/*" onchange="uploadImg(this, 2, 'before')">
      </div>
      <div class="img-upload-group">
        <span>Goal 사진</span>
        <label class="upload-btn" for="img-ho-goal">📷 파일 선택</label>
        <input type="file" id="img-ho-goal" accept="image/*" onchange="uploadImg(this, 2, 'goal')">
      </div>
    </div>
  </div>

  <!-- 고 -->
  <div class="card">
    <div class="card-label">member 03</div>
    <div class="member-name">고</div>
    <div class="field-row">
      <div class="field-group">
        <label>현재 횟수</label>
        <input type="number" id="go-current" min="0">
      </div>
      <div class="slash">/</div>
      <div class="field-group">
        <label>목표 횟수</label>
        <input type="number" id="go-total" min="1">
      </div>
    </div>
    <div class="img-upload-row">
      <div class="img-upload-group">
        <span>Before 사진</span>
        <label class="upload-btn" for="img-go-before">📷 파일 선택</label>
        <input type="file" id="img-go-before" accept="image/*" onchange="uploadImg(this, 3, 'before')">
      </div>
      <div class="img-upload-group">
        <span>Goal 사진</span>
        <label class="upload-btn" for="img-go-goal">📷 파일 선택</label>
        <input type="file" id="img-go-goal" accept="image/*" onchange="uploadImg(this, 3, 'goal')">
      </div>
    </div>
  </div>

  <!-- 혁 -->
  <div class="card">
    <div class="card-label">member 04</div>
    <div class="member-name">혁</div>
    <div class="field-row">
      <div class="field-group">
        <label>현재 횟수</label>
        <input type="number" id="hyuk-current" min="0">
      </div>
      <div class="slash">/</div>
      <div class="field-group">
        <label>목표 횟수</label>
        <input type="number" id="hyuk-total" min="1">
      </div>
    </div>
    <div class="img-upload-row">
      <div class="img-upload-group">
        <span>Before 사진</span>
        <label class="upload-btn" for="img-hyuk-before">📷 파일 선택</label>
        <input type="file" id="img-hyuk-before" accept="image/*" onchange="uploadImg(this, 4, 'before')">
      </div>
      <div class="img-upload-group">
        <span>Goal 사진</span>
        <label class="upload-btn" for="img-hyuk-goal">📷 파일 선택</label>
        <input type="file" id="img-hyuk-goal" accept="image/*" onchange="uploadImg(this, 4, 'goal')">
      </div>
    </div>
  </div>

  <div class="save-area">
    <button class="btn" id="saveBtn" onclick="save()">저장하기</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://zvrwumrucxyenfngpyhv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2cnd1bXJ1Y3h5ZW5mbmdweWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5ODA1ODYsImV4cCI6MjA5MzU1NjU4Nn0.HLwY651fIfJkJECt_IPPhJEM_mzYBdM-NEv_ImsNwvo';
const PW = '0000';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const KEY_MAP = { 1: 'chun', 2: 'ho', 3: 'go', 4: 'hyuk' };

/* ─── PIN 입력 처리 ─── */
const pins = document.querySelectorAll('#pinInputs input');

pins.forEach((inp, i) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/[^0-9]/g, '').slice(-1);
    if (inp.value && i < 3) pins[i+1].focus();
    if ([...pins].every(p => p.value.length === 1)) checkPin();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && i > 0) {
      pins[i-1].focus();
      pins[i-1].value = '';
    }
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
    [...txt.slice(0,4)].forEach((ch, j) => { if (pins[j]) pins[j].value = ch; });
    const last = Math.min(txt.length, 4) - 1;
    if (pins[last]) pins[last].focus();
    if (txt.length >= 4) checkPin();
  });
});

// 새로고침 시 재인증 불필요
if (sessionStorage.getItem('authed')) {
  document.getElementById('pwOverlay').classList.add('hidden');
  showMain();
} else {
  pins[0].focus();
}

function checkPin() {
  const entered = [...pins].map(p => p.value).join('');
  if (entered === PW) {
    sessionStorage.setItem('authed', '1');
    document.getElementById('pwOverlay').classList.add('hidden');
    showMain();
  } else {
    document.getElementById('pwErr').textContent = '잘못된 PIN입니다';
    pins.forEach(p => { p.classList.add('error'); p.value = ''; });
    setTimeout(() => {
      pins.forEach(p => p.classList.remove('error'));
      document.getElementById('pwErr').textContent = '';
      pins[0].focus();
    }, 800);
  }
}

/* ─── 메인 화면 표시 + 현재값 로드 ─── */
async function showMain() {
  document.getElementById('mainContent').style.display = 'block';
  setStatus('현재 값을 불러오는 중...', '');

  const { data, error } = await sb.from('member').select('*').order('id');
  if (error || !data) {
    setStatus('불러오기 실패: ' + (error?.message || '알 수 없는 오류'), 'err');
    return;
  }

  data.forEach(row => {
    const key = KEY_MAP[row.id];
    if (!key) return;
    document.getElementById(`${key}-current`).value = row.current;
    document.getElementById(`${key}-total`).value = row.total;
  });

  setStatus('현재 값을 불러왔습니다', 'ok');
}

/* ─── 저장 ─── */
async function save() {
  const members = [
    { id: 1, key: 'chun' },
    { id: 2, key: 'ho' },
    { id: 3, key: 'go' },
    { id: 4, key: 'hyuk' }
  ];

  const vals = members.map(m => ({
    id: m.id,
    current: parseInt(document.getElementById(`${m.key}-current`).value),
    total: parseInt(document.getElementById(`${m.key}-total`).value)
  }));

  for (const v of vals) {
    if (isNaN(v.current) || isNaN(v.total) || v.total < 1) {
      setStatus('입력값이 올바르지 않습니다', 'err'); return;
    }
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setStatus('저장 중...', '');

  try {
    const results = await Promise.all(
      vals.map(v => sb.from('member').update({ current: v.current, total: v.total }).eq('id', v.id))
    );
    const failed = results.find(r => r.error);
    if (failed) {
      setStatus('저장 실패: ' + failed.error.message, 'err');
    } else {
      setStatus('✅ 저장 완료!', 'ok');
    }
  } catch(e) {
    setStatus('오류: ' + e.message, 'err');
  }
  btn.disabled = false;
}

/* ─── 이미지 업로드 ─── */
async function uploadImg(input, memberId, type) {
  const file = input.files[0];
  if (!file) return;

  setStatus('업로드 중...', '');

  const { error: uploadError } = await sb.storage
    .from('312goal_img')
    .upload(file.name, file, { upsert: true, contentType: file.type });

  if (uploadError) {
    setStatus('업로드 실패: ' + uploadError.message, 'err');
    input.value = '';
    return;
  }

  const { data: urlData } = sb.storage.from('312goal_img').getPublicUrl(file.name);
  const column = type === 'before' ? 'before_img' : 'goal_img';

  const { error: updateError } = await sb.from('member')
    .update({ [column]: urlData.publicUrl })
    .eq('id', memberId);

  if (updateError) {
    setStatus('DB 업데이트 실패: ' + updateError.message, 'err');
  } else {
    setStatus('✅ 사진 업로드 완료!', 'ok');
  }
  input.value = '';
}

function setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
