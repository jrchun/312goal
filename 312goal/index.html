<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>150 Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4f0ec;
    --text: #1a1a1a;
    --accent: #e04a2f;
    --muted: #9a9590;
    --bar-bg: #ddd8d2;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    padding: 20px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
  }
  .date-tag {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
  }

  .year-bar {
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .year-bar .label {
    font-size: 10px;
    color: var(--muted);
    min-width: 72px;
    font-weight: 400;
  }
  .track { flex: 1; height: 3px; background: var(--bar-bg); border-radius: 2px; overflow: hidden; }
  .track .fill { height: 100%; border-radius: 2px; transition: width 1s ease; }
  .track .fill.yr { background: #b5b0aa; }
  .track .fill.wk { background: var(--accent); }
  .pct-num {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--muted);
    min-width: 38px;
    text-align: right;
  }

  .tabs { display: flex; padding: 4px 20px 0; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0 8px;
    font-size: 14px;
    font-weight: 700;
    color: #d0ccc8;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: all 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .panel { display: none; padding: 16px 20px 0; }
  .panel.active { display: block; }

  .img-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 16px;
    overflow: hidden;
    background: #ddd;
  }
  .img-before {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  .img-after-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    clip-path: inset(100% 0 0 0);
    transition: clip-path 1.2s cubic-bezier(.25,.46,.45,.94);
  }
  .img-after {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .fill-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    z-index: 3;
    bottom: 0;
    box-shadow: 0 0 8px rgba(224,74,47,0.4);
    transition: bottom 1.2s cubic-bezier(.25,.46,.45,.94);
  }
  .fill-tag {
    position: absolute;
    right: 8px;
    top: -20px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 11px;
    color: #fff;
    background: var(--accent);
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .counter {
    text-align: center;
    margin: 18px 0 12px;
  }
  .counter-big {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 48px;
    line-height: 1;
    letter-spacing: -1px;
  }
  .counter-big .cur { color: var(--accent); }
  .counter-big .sep { color: var(--bar-bg); margin: 0 2px; font-weight: 300; }
  .counter-big .tot { color: var(--bar-bg); }
  .counter-sub {
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .wk-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .wk-bar .label { font-size: 11px; color: var(--muted); min-width: 44px; }
  .wk-bar .track { height: 6px; border-radius: 3px; }
  .wk-pct {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--accent);
    min-width: 44px;
    text-align: right;
  }

  .compare {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 10px;
    background: rgba(0,0,0,0.02);
    border-radius: 10px;
    line-height: 1.5;
  }
  .compare .up { color: #27ae60; font-weight: 700; }
  .compare .down { color: var(--accent); font-weight: 700; }

  .loading-msg {
    text-align: center;
    padding: 40px 20px;
    font-size: 13px;
    color: var(--muted);
  }

  .admin-emoji {
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="header">
  <h1>150 Challenge <a href="admin.html" class="admin-emoji">🏋️</a></h1>
  <span class="date-tag" id="dateTag"></span>
</div>

<div class="year-bar">
  <span class="label">2026년 경과율</span>
  <div class="track"><div class="fill yr" id="yrFill"></div></div>
  <span class="pct-num" id="yrPct"></span>
</div>

<div class="tabs" id="tabsWrap"></div>
<div id="panelsWrap"></div>
<div class="loading-msg" id="loadingMsg">불러오는 중...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://zvrwumrucxyenfngpyhv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2cnd1bXJ1Y3h5ZW5mbmdweWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5ODA1ODYsImV4cCI6MjA5MzU1NjU4Nn0.HLwY651fIfJkJECt_IPPhJEM_mzYBdM-NEv_ImsNwvo';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Date / year bar
const now = new Date();
const ys = new Date(2026,0,1), ye = new Date(2026,11,31,23,59,59);
const yrPct = Math.min(100, Math.max(0, ((now-ys)/(ye-ys))*100));
document.getElementById('dateTag').textContent =
  `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
document.getElementById('yrFill').style.width = yrPct.toFixed(1)+'%';
document.getElementById('yrPct').textContent = yrPct.toFixed(1)+'%';

async function init() {
  const { data, error } = await sb.from('member').select('*').order('id');
  if (error || !data || data.length === 0) {
    document.getElementById('loadingMsg').textContent = '데이터를 불러오지 못했습니다.';
    return;
  }

  document.getElementById('loadingMsg').style.display = 'none';

  const tabsWrap = document.getElementById('tabsWrap');
  const panelsWrap = document.getElementById('panelsWrap');

  data.forEach((row, idx) => {
    const key = row.id;
    const pct = (row.current / row.total) * 100;
    const diff = pct - yrPct;
    const diffCount = Math.round(Math.abs(diff) / 100 * row.total);
    const cmpHTML = diff >= 0
      ? `연도 대비 <span class="up">+${diff.toFixed(1)}%p 앞서는 중 (약 ${diffCount}회 여유)</span> 👏`
      : `연도 대비 <span class="down">${diff.toFixed(1)}%p 뒤처지는 중 (약 ${diffCount}회 부족)</span> — 더 뛰자 🔥`;

    // Tab
    const tab = document.createElement('div');
    tab.className = 'tab' + (idx === 0 ? ' active' : '');
    tab.dataset.t = key;
    tab.textContent = row.name;
    tabsWrap.appendChild(tab);

    // Panel
    const panel = document.createElement('div');
    panel.className = 'panel' + (idx === 0 ? ' active' : '');
    panel.id = `p-${key}`;
    panel.innerHTML = `
      <div class="img-stage">
        <img class="img-before" src="${row.before_img}" alt="before">
        <div class="img-after-wrap" id="aw-${key}">
          <img class="img-after" src="${row.goal_img}" alt="goal">
        </div>
        <div class="fill-line" id="fl-${key}"><span class="fill-tag" id="ft-${key}"></span></div>
      </div>
      <div class="counter">
        <div class="counter-big">
          <span class="cur" id="c-${key}">${row.current}</span><span class="sep">/</span><span class="tot">${row.total}</span>
        </div>
        <div class="counter-sub">workouts completed</div>
      </div>
      <div class="wk-bar">
        <span class="label">진척률</span>
        <div class="track"><div class="fill wk" id="wf-${key}"></div></div>
        <span class="wk-pct" id="wp-${key}">${pct.toFixed(1)}%</span>
      </div>
      <div class="compare">${cmpHTML}</div>
    `;
    panelsWrap.appendChild(panel);
  });

  // Animations (after DOM renders)
  setTimeout(() => {
    data.forEach(row => {
      const key = row.id;
      const pct = (row.current / row.total) * 100;
      document.getElementById(`aw-${key}`).style.clipPath = `inset(${(100-pct).toFixed(1)}% 0 0 0)`;
      document.getElementById(`fl-${key}`).style.bottom = pct.toFixed(1) + '%';
      document.getElementById(`ft-${key}`).textContent = pct.toFixed(1) + '%';
      document.getElementById(`wf-${key}`).style.width = pct.toFixed(1) + '%';
    });
  }, 400);

  // Tab switch
  tabsWrap.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('p-' + tab.dataset.t).classList.add('active');
  });
}

init();
</script>

</body>
</html>
