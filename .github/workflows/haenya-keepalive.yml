# 했냐: Supabase 무료 플랜은 7일 동안 요청이 없으면 프로젝트가 잠든다(일시 정지).
# 하루 한 번 가벼운 읽기 요청을 보내 깨워 둔다. 공개용(publishable) 키만 쓴다.
# 주의: GitHub의 예약 실행은 기본 브랜치(main)에 이 파일이 있어야 동작한다.
name: haenya-keepalive

on:
  schedule:
    - cron: '17 21 * * *' # 매일 06:17 (한국 시간)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://hfnwadutbowgxrosnypz.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Sobhyh8d3S0u9WXLoilazw_K2_EmF2u
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/seasons?select=year&limit=1" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded: $code"
          test "$code" = "200"
